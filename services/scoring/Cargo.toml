[package]
name = "scoring"
version = "0.1.0"
edition = "2021"

[dependencies]
axum       = "0.7"
tokio      = { version = "1.0",  features = ["full"] }
serde      = { version = "1.0",  features = ["derive"] }
serde_json = "1.0"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow     = "1.0"
dotenvy    = "0.15"

# Direct Postgres access from the Rust raw-zone (Phase 4 decision, see docs/backlog.md)
# Using query() non-macro API — no compile-time DB required, works in Docker build.
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
] }
uuid    = { version = "1",   features = ["serde"] }
chrono  = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
