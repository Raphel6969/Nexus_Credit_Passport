services:
  postgres:
    image: postgres:16
    container_name: nexus-postgres
    env_file: .env.local
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: nexus-api
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus
      SCORING_SERVICE_URL: http://scoring:8081
      INGESTION_SERVICE_URL: http://ingestion:8080
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-network

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: nexus-ingestion
    env_file: .env.local
    environment:
      DATABASE_URL_GO: postgres://nexus:nexus@postgres:5432/nexus
      SETU_BASE_URL: http://setu-mock:9090
      GSTN_BASE_URL: http://gstn-mock:9091
      RAZORPAY_BASE_URL: http://razorpay-mock:9092
      ZOHO_BASE_URL: http://zoho-mock:9093
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-network

  scoring:
    build:
      context: ./services/scoring
      dockerfile: Dockerfile
    container_name: nexus-scoring
    env_file: .env.local
    environment:
      # Direct Postgres access — Phase 4 trust-boundary decision (see docs/backlog.md)
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      MODEL_PATH: /app/model/model_meta.json
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nexus-network


  setu-mock:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile.mock
    container_name: nexus-setu-mock
    ports:
      - "9090:9090"
    networks:
      - nexus-network

  gstn-mock:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile.gstn-mock
    container_name: nexus-gstn-mock
    ports:
      - "9091:9091"
    networks:
      - nexus-network

  razorpay-mock:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile.razorpay-mock
    container_name: nexus-razorpay-mock
    ports:
      - "9092:9092"
    networks:
      - nexus-network

  zoho-mock:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile.zoho-mock
    container_name: nexus-zoho-mock
    ports:
      - "9093:9093"
    networks:
      - nexus-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: nexus-web
    env_file: .env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://api:8000
      API_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "http = require('http'); const req = http.get('http://127.0.0.1:3000/api/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }); req.on('error', (err) => { process.exit(1); });"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nexus-network

volumes:
  postgres_data:

networks:
  nexus-network:
    driver: bridge